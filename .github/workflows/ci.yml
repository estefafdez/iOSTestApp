name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    permissions:
      contents: write # push the coverage badge to the badges branch
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Pick an iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and run the unit tests
        run: |
          set -o pipefail
          xcodebuild test -project TestApp.xcodeproj -scheme TestApp \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -enableCodeCoverage YES -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log || status=$?
          if [ "${status:-0}" -ne 0 ]; then
            grep -E "error:|Test Case .* failed|TEST FAILED|Testing failed" xcodebuild.log | head -20 | while read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
      - name: Convert the result bundle to JUnit XML
        if: always()
        run: |
          brew install a7ex/homebrew-formulae/xcresultparser
          xcresultparser --output-format junit TestResults.xcresult > junit.xml

      # Fork PRs get a read-only token, so only publish for branches of this repo.
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action/macos@v2
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          files: junit.xml
          comment_title: Test Results

      - name: Compute line coverage
        id: coverage
        run: |
          pct=$(xcrun xccov view --report --json TestResults.xcresult | jq -r '[.targets[] | select(.name | endswith(".app"))][0].lineCoverage * 100 | round')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "### Line coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          PCT: ${{ steps.coverage.outputs.pct }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PCT" -ge 80 ]; then color=brightgreen; elif [ "$PCT" -ge 60 ]; then color=yellow; else color=red; fi
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" badges > /dev/null; then
            git clone --depth 1 --branch badges "$url" "$RUNNER_TEMP/badges"
          else
            git init -b badges "$RUNNER_TEMP/badges"
          fi
          cd "$RUNNER_TEMP/badges"
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$color" > coverage.json
          git add coverage.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore: update coverage badge to ${PCT}%"
            git push "$url" HEAD:badges
          fi
