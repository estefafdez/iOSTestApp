name: Lab screenshots

on:
  push:
    branches: [ci/lab-screenshots-115-119]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-latest
    permissions:
      contents: write # commit the exported screenshots back to this branch
    steps:
      - uses: actions/checkout@v7
      - name: Pick an iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Reset simulator privacy permissions
        run: |
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl privacy "$DEVICE_ID" reset all com.estefafdez.TestApp
      - name: Run the screenshot UI tests
        run: |
          set -o pipefail
          xcodebuild test -project TestApp.xcodeproj -scheme TestApp \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:TestAppUITests/FormUITests/testFormScreenshots \
            -only-testing:TestAppUITests/ListUITests/testListScreenshots \
            -only-testing:TestAppUITests/FavoritesUITests/testFavoritesScreenshots \
            -only-testing:TestAppUITests/LocationPermissionUITests/testLocationScreenshots \
            -only-testing:TestAppUITests/AppearanceUITests/testAppearanceScreenshots \
            -resultBundlePath LabResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log || status=$?
          if [ "${status:-0}" -ne 0 ]; then
            grep -E "error:|Test Case .* failed|TEST FAILED|Testing failed" xcodebuild.log | head -20 | while read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
      - name: Export and rename screenshots
        run: |
          set -euo pipefail
          mkdir -p exported lab-screenshots
          xcrun xcresulttool export attachments --path LabResults.xcresult --output-path exported
          jq -r '.[].attachments[] | [.exportedFileName, .suggestedHumanReadableName] | @tsv' exported/manifest.json | while IFS=$'\t' read -r file human; do
            base="${human%%_*}"
            mv "exported/$file" "lab-screenshots/${base}.png"
          done
          count=$(ls lab-screenshots/*.png | wc -l | tr -d ' ')
          echo "Exported $count screenshots"
          if [ "$count" -ne 10 ]; then
            echo "::error::expected 10 screenshots, got $count"
            exit 1
          fi
      - name: Commit screenshots to this branch
        run: |
          git config user.name "estefafdez"
          git config user.email "estefafdez@gmail.com"
          git add lab-screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "test: export lab UI screenshots for articles 115-119 [skip ci]"
            git push
          fi
